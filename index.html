const moodRules={relax:{label:'累了，想放松',words:['喜剧','动画','家庭','音乐','歌舞','儿童','治愈','轻松'],avoid:['惊悚','恐怖','犯罪','灾难']},heal:{label:'想被治愈',words:['剧情','家庭','爱情','动画','成长','温情','治愈'],avoid:['恐怖','惊悚']},focus:{label:'想认真看点东西',words:['纪录片','传记','历史','剧情','社会','文学','哲学','艺术'],avoid:[]},excite:{label:'想来点刺激',words:['动作','悬疑','犯罪','科幻','冒险','运动','惊悚'],avoid:[]},romance:{label:'想看情感/浪漫',words:['爱情','剧情','同性','女性','情感'],avoid:['恐怖']},short:{label:'时间不多',words:['短片','喜剧','动画'],avoid:['史诗','战争']}};

function arr(v){return Array.isArray(v)?v:(v&&typeof v==='object'?[]:(v?[v]:[]))}function uniq(a){return[...new Set(a.filter(Boolean))].sort((x,y)=>x.localeCompare(y,'zh-CN'))}function escapeHtml(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function shortList(v,n=8){const a=arr(v).filter(Boolean);return a.slice(0,n).join('、')||'暂无'}
function fillOptions(){el('totalStat').textContent=`${movies.length} 部想看影视`;for(const g of uniq(movies.flatMap(x=>arr(x.genres))))el('genre').insertAdjacentHTML('beforeend',`<option value="${escapeHtml(g)}">${escapeHtml(g)}</option>`);for(const c of uniq(movies.flatMap(x=>arr(x.countries))))el('country').insertAdjacentHTML('beforeend',`<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`);for(const p of uniq(movies.flatMap(x=>[...arr(x.creators),...arr(x.cast)])))el('personList').insertAdjacentHTML('beforeend',`<option value="${escapeHtml(p)}"></option>`)}

function scoreItem(item){let score=Math.random()*2,reasons=[],hay=(item.searchText||'').toLowerCase();if(selectedMood){const rule=moodRules[selectedMood];let matched=[];for(const w of rule.words){if(hay.includes(w.toLowerCase()))matched.push(w)}for(const w of rule.avoid){if(hay.includes(w.toLowerCase()))score-=2}if(matched.length){score+=matched.length*4;reasons.push(`匹配「${rule.label}」：${matched.slice(0,3).join(' / ')}`)}}const year=(item.date||'').slice(0,4);if(year&&Number(year)>=2024){score+=1;reasons.push('最近加入想看')}return{score,reasons}}
function randomPick(pool){if(!pool.length)return null;return pool[Math.floor(Math.random()*pool.length)]}
function directPool(){const genre=el('genre').value.trim(),country=el('country').value.trim(),person=el('person').value.trim().toLowerCase(),kw=el('keyword').value.trim().toLowerCase();return movies.filter(x=>!genre||arr(x.genres).includes(genre)).filter(x=>!country||arr(x.countries).includes(country)).filter(x=>!person||[...arr(x.creators),...arr(x.cast)].some(v=>String(v).toLowerCase().includes(person))).filter(x=>!kw||(x.searchText||'').includes(kw)).map(x=>({...x,...scoreItem(x)})).sort((a,b)=>b.score-a.score)}

function mainTitle(title){return String(title||'').split(' / ')[0].replace(/[\uFF08(]\\d{4}[\uFF09)]/g,'').trim()}
async function fetchOnlineInfo(item){
  const title=mainTitle(item.title);
  if(!title)return null;
  const api='https://zh.wikipedia.org/w/api.php?origin=*&format=json&action=query&generator=search&gsrsearch='+encodeURIComponent(title)+'&gsrlimit=1&prop=extracts|info|pageimages&exintro=1&explaintext=1&inprop=url&pithumbsize=600&redirects=1';
  const response=await fetch(api);
  if(!response.ok)throw new Error('online lookup failed');
  const data=await response.json();
  const pages=Object.values(data.query?.pages||{});
  const page=pages[0];
  const extract=String(page?.extract||'').trim();
  if(!page||!extract)return null;
  return{title:page.title||title,extract,url:page.fullurl||'',thumbnail:page.thumbnail?.source||''};
}
async function hydrateOnline(item,targetId,label){
  if(item.onlineSummary||item.onlineTried||item.onlineLoading)return;
  item.onlineLoading=true;
  try{
    const info=await fetchOnlineInfo(item);
    if(info){
      item.onlineSummary=info.extract;
      item.onlineReason='联网资料显示「'+info.title+'」的核心信息是：'+info.extract.slice(0,90)+(info.extract.length>90?'...':'');
      item.onlineSource=info.url;
      item.onlineSourceTitle=info.title;if(info.thumbnail)item.poster=info.thumbnail;
      renderSingle(item,targetId,label);
    }
  }catch(e){}finally{item.onlineLoading=false;item.onlineTried=true}
}

function clearFilters(){selectedMood='';el('genre').value='';el('country').value='';el('person').value='';el('keyword').value='';document.querySelectorAll('#moods button').forEach(x=>x.classList.remove('active'));el('directHint').textContent='';el('directResult').innerHTML=''}
